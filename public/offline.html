<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0369A1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Hors ligne · EauPartagée</title>
    <style>
      :root {
        --bg: #0369a1;
        --ink: #ffffff;
        --ink-2: #d6ecfa;
        --button: #f4f8fb;
        --button-ink: #0f2233;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(120% 90% at 100% 0%, rgb(14 165 233 / 0.18) 0%, transparent 55%), var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        min-height: 100dvh;
        max-width: 28rem;
        margin: 0 auto;
        padding: calc(env(safe-area-inset-top) + 3rem) 1.5rem calc(env(safe-area-inset-bottom) + 3rem);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 1rem;
      }
      h1 {
        margin: 0;
        font-size: 2.25rem;
        line-height: 1.1;
      }
      p {
        margin: 0;
        color: var(--ink-2);
        font-size: 1.0625rem;
        line-height: 1.5;
      }
      a.button {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 999px;
        background: var(--button);
        color: var(--button-ink);
        font: inherit;
        font-weight: 700;
      }
      a.button:focus-visible {
        outline: 3px solid #e0f2fe;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="#075985" />
        <path d="M32 10.5c-1.2 1.5-14 16.6-14 27.5a14 14 0 0 0 28 0c0-10.9-12.8-26-14-27.5z" fill="#F4F8FB" />
        <path d="M24.5 39.5a8 8 0 0 0 7 7" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
      </svg>
      <h1>Pas de connexion</h1>
      <p>
        EauPartagée n’a pas encore pu s’installer sur cet appareil. Ouvrez-la une première fois avec une connexion :
        elle fonctionnera ensuite hors ligne.
      </p>
      <!-- Lien plutôt que bouton : la CSP interdit les scripts en ligne. -->
      <a class="button" href="/">Réessayer</a>
    </main>
  </body>
</html>
